site_name: trnsci
site_description: Scientific computing libraries for AWS Trainium
site_url: https://trnsci.dev/
repo_url: https://github.com/trnsci/trnsci
repo_name: trnsci/trnsci

copyright: >
  Copyright &copy; 2026 Scott Friedman &middot; Apache-2.0.
  trnsci is an independent open-source project &mdash; not sponsored by, endorsed by,
  or affiliated with Amazon, AWS, or Annapurna Labs. See the
  <a href="/disclaimer/">full disclaimer</a>.

theme:
  name: material
  custom_dir: overrides
  font:
    text: Atkinson Hyperlegible
    code: Atkinson Hyperlegible Mono
  palette:
    scheme: default
    primary: indigo
  features:
    - content.code.copy
    - navigation.sections
    - navigation.tabs
    - navigation.indexes

hooks:
  # Fills [[pypi:...]], [[min:...]] and [[described:...=X]] version tokens at
  # build time from PyPI and pyproject.toml, so version tables can't go stale.
  - hooks/versions.py

plugins:
  - search
  # monorepo composes each sub-project's mkdocs.yml into this site under its
  # own path (e.g. trnsci.dev/trnfft/). Sub-project repos are cloned into
  # sibling directories by the CI workflow before this plugin runs.
  - monorepo
  - blog:
      blog_dir: blog
      # URLs and visible UI are date-free; the date in frontmatter remains
      # only for ordering and RSS metadata.
      post_url_format: "{slug}"
      archive: false
      categories: true
      pagination_per_page: 10

nav:
  - Home: index.md
  - Why trnsci: why.md
  - CUDA → trnsci: cuda_rosetta.md
  - Trainium positioning: trainium_positioning.md
  - Roadmap: roadmap.md
  - Exemplars: exemplars.md
  - NKI validation status: nki_validation_status.md
  - Precision and platform limits: precision_and_platform_limits.md
  - Blog:
      - blog/index.md
  - Getting started:
      - Installation: installation.md
      - Deployment: deployment.md
      - Developing kernels: developing_kernels.md
  - Workflows:
      - Integration (DF-MP2): workflows/integration.md
      - Speech enhancement: workflows/speech_enhancement.md
      - Quantum chemistry: workflows/quantum_chemistry.md
  - Libraries:
      - trnfft: "!include ./trnfft/mkdocs.yml"
      - trnblas: "!include ./trnblas/mkdocs.yml"
      - trnrand: "!include ./trnrand/mkdocs.yml"
      - trnsolver: "!include ./trnsolve/mkdocs.yml"
      - trnsparse: "!include ./trnsparse/mkdocs.yml"
      - trntensor: "!include ./trntensor/mkdocs.yml"
  - Contributing: contributing.md
  - Disclaimer: disclaimer.md

extra_css:
  - stylesheets/blog.css

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        # Mermaid diagrams in fenced code blocks: ```mermaid ... ```
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
